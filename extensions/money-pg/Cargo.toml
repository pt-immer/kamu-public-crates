[workspace]
members = ["kamu-money-pg"]
# A locally checked-out pgrx is its OWN workspace. Without this, cargo resolves
# ITS members' inherited fields against THIS root and dies in `cargo metadata`
# before compiling anything. See the escape hatch at the end of the patch note.
exclude = ["vendor"]
resolver = "3"

# pgrx comes from our fork on EVERY build, not only the YugabyteDB one.
#
# WHY IT IS UNCONDITIONAL. `kamu-money-pg` declares `yb-pg15 = ["pgrx/yb-pg15"]`,
# and cargo validates that reference while resolving the graph -- whether or not
# the feature is enabled. A build resolving pgrx from crates.io, where no such
# feature exists, fails outright. The patch is therefore committed rather than
# injected at build time by a script.
#
# HTTPS, NOT SSH. This manifest is committed to a public repository; an `ssh://`
# or `git@` form would break every CI runner and every clone without a key. The
# fork is public, so HTTPS costs nothing.
#
# THE FORK IS UPSTREAM v0.19.1 PLUS 33 cfg-GATED LINES, every one inside
# `#[cfg(feature = "yb-pg15")]`, so without that feature the crates compile
# byte-identical to the release they are based on -- which is what the
# PostgreSQL 15-18 matrix exists to keep proving.
#
# It also RETIRES the shim's worst property. The predecessor vendored pgrx and
# rewrote it textually at build time, and `re.sub`/`str.replace` return the
# subject UNCHANGED when nothing matches: a YugabyteDB release that moved a
# symbol produced a SUCCESSFUL build of an UNSHIMMED extension. There is no text
# to patch any more, so that failure class is gone.
#
# The crate names and version stay `pgrx`/`pgrx-pg-sys` at 0.19.1 on purpose:
# `[patch.crates-io]` matches on crate NAME, and `cargo-pgrx` refuses to build an
# extension whose pgrx version differs from the CLI's own. Releases are
# distinguished by TAG; `Cargo.lock` pins the exact commit.
#
# To try an unpushed fork revision, check it out at `vendor/pgrx-yugabytedb` and
# switch these two lines to `path = "vendor/pgrx-yugabytedb/pgrx"` -- that is
# what `exclude = ["vendor"]` above exists for.
[patch.crates-io]
pgrx = { git = "https://github.com/pt-immer/pgrx-yugabytedb", tag = "v0.19.1-yb.1" }
pgrx-pg-sys = { git = "https://github.com/pt-immer/pgrx-yugabytedb", tag = "v0.19.1-yb.1" }

[workspace.package]
authors = [
  "PT. IMMER Contributors <https://github.com/pt-immer>",
  "PT. IMMER Engineers <https://github.com/orgs/pt-immer/teams/engineering>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
# This lane is NOT publishable and the manifest says so rather than leaving it to
# a workflow guard. `kamu-money-pg` is a `cdylib` whose dependency graph resolves
# through the `[patch.crates-io]` above, and cargo does not package a patch: a
# published crate would silently resolve pgrx from crates.io, where `yb-pg15`
# does not exist. There is no version of this crate that `cargo publish` can
# produce correctly, so the answer is `false` at the root, not a reviewer's memory.
publish = false
repository = "https://github.com/pt-immer/kamu-public-crates"
# Higher than the main workspace's 1.94 -- pgrx 0.19.1 requires 1.96. Keeping the
# lane separate is what lets the nine published crates stay at their own floor.
rust-version = "1.97"

# pgrx REQUIRES unwinding: it maps PostgreSQL's ereport/longjmp error handling
# onto Rust panics, so `panic = "abort"` would turn a recoverable SQL error into
# a process abort that takes the whole backend down. These live at the workspace
# root because cargo IGNORES profiles declared in non-root members -- it warns,
# and the result would otherwise be a silent revert to the default. This is one
# of the four reasons the lane cannot be a member of the main workspace.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
