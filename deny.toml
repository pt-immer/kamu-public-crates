# cargo-deny configuration for the kamu-public-crates workspace.
#
# Crate source code is dual-licensed under MIT OR Apache-2.0. The kamu-iso3166
# crate additionally embeds ISO 3166 CSV data licensed under CC BY-SA 4.0
# (vendored from github.com/ipregistry/iso3166); CC-BY-SA-4.0 is explicitly
# allowed below to cover the NOTICE-documented data attribution. It is not
# mixed into compiled binaries.

[graph]
all-features = true

[advisories]
ignore = [
  # RUSTSEC-2023-0071: "Marvin Attack" timing side-channel in the `rsa` crate.
  # `rsa` enters via the kamu-snap-* SNAP BI crates (kamu-snap-crypto and the
  # crates that depend on it). There is NO patched release —
  # https://github.com/RustCrypto/RSA/issues/626
  # is still open and cargo-deny reports "No safe upgrade is available"; `rsa`
  # is also the only maintained pure-Rust PKCS#8 RSA implementation, so there is
  # no drop-in alternative. SNAP BI's default signing path is HMAC-SHA512; RSA
  # is used only where Bank Indonesia's spec mandates RSASSA signature
  # generation/verification (the private key operates on the signer's own
  # message hash, not on attacker-chosen ciphertext, so the classic decryption
  # oracle does not apply). The residual signing-timing risk should be mitigated
  # at deployment (keep signing keys off network-observable hot paths). Revisit
  # and drop this ignore the moment a constant-time `rsa` release ships.
  "RUSTSEC-2023-0071",
  # RUSTSEC-2026-0258: `h2` accepts and queues empty HTTP/2 DATA frames without
  # limit, so a peer can drive a server's memory up. Patched in >= 0.4.16, which
  # this lockfile now takes; the remaining exposure is `h2` 0.3, which has NO
  # patched release and enters through actix-http -> actix-web, a dependency of
  # kamu-logging and the two kamu-snap-*-actix adapters.
  #
  # These crates are libraries: the reachable risk is a denial of service
  # against a downstream actix HTTP/2 SERVER, not against anything this
  # repository runs, and it is remote-triggerable for whoever deploys one.
  # Deployments terminating HTTP/2 at a proxy that bounds concurrent streams are
  # not reached through it.
  #
  # Drop this ignore when actix-http releases against h2 0.4, or when the 0.3
  # line receives a backport.
  "RUSTSEC-2026-0258",
]
version = 2
yanked = "deny"

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC-BY-SA-4.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8
version = 2

[bans]
# `warn` (not `deny`): kamu-logging pulls in the actix/tracing tree, which
# carries some unavoidable transitive version skew (e.g. getrandom, socket2).
multiple-versions = "warn"
wildcards = "deny"

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"
