version: 2
updates:
  # Cargo: a single entry at the workspace root covers every member crate via
  # the shared Cargo.lock.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Excluded workspace: separate manifest, patch, and lockfile.
  - package-ecosystem: cargo
    directory: "/extensions/money-pg"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Standalone Cloudflare Worker: its Cargo and npm graphs are outside the root
  # workspaces and therefore need their own update owners.
  - package-ecosystem: cargo
    directory: "/crates/logging/examples/cloudflare-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/crates/logging/examples/cloudflare-worker"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # npm: the repo-local docs-linting toolchain (markdownlint-cli2). Not
  # published, but its transitive tree is what `just lint-docs` executes, and
  # markdownlint-cli2 pins several deps to exact versions — so a patched
  # transitive only arrives via a direct bump or a package.json `overrides`
  # entry, never via `npm update`.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Git submodules: the vendored ISO 3166 CSV dataset (ipregistry/iso3166)
  # receives automatic upstream data updates roughly monthly. A bump only
  # changes generated tables when countries.csv / subdivisions.csv move —
  # when they do, re-check the pinned counts in
  # crates/iso3166/tests/codegen_invariants.rs.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
