version: 2
updates:
  # Cargo: a single entry at the workspace root covers every member crate via
  # the shared Cargo.lock.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  # Git submodules: the vendored ISO 3166 CSV dataset (ipregistry/iso3166)
  # receives automatic upstream data updates roughly monthly. A bump only
  # changes generated tables when countries.csv / subdivisions.csv move —
  # when they do, re-check the pinned counts in
  # crates/iso3166/tests/codegen_invariants.rs.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
