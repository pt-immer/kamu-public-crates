name: On PR Synced

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also run post-merge on main so the CI badge reflects the integration branch
  # and main keeps a green signal. On push, paths-filter diffs before..after, so
  # the same per-crate gating applies. (ci-success on push is signal-only — the
  # branch ruleset's required check applies to PR merges, not pushes.)
  push:
    branches: [main]

# NOTE: no workflow-level `paths:` filter — that would prevent the check
# contexts from being created on unrelated PRs, leaving any required status
# check stuck "Expected" forever. Gating happens at the JOB level via `if:`
# (a skipped required job is treated as success), and a single always-running
# `ci-success` aggregate gate is the one context the branch ruleset requires.

# Every job runs its command through `just <recipe>` so the Justfile is the
# single source of truth for build/lint/test/coverage commands and `just <recipe>`
# reproduces any CI job locally. The job-level fan-out (per crate, path-filtered)
# is a CI concern; the recipes it calls are the granular ones the aggregates
# compose. Even the cargo-deny job runs `just deny` (cargo-deny installed via
# taiki-e/install-action) — no dedicated action, so CI == local invocation.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Select the `ci` profile in .config/nextest.toml for every cargo-nextest run
  # in this workflow (tests and coverage alike): no fail-fast, so one push
  # surfaces every broken test rather than one per round-trip, and failure
  # output repeated at the end of the log.
  NEXTEST_PROFILE: ci

permissions:
  contents: read

jobs:
  # Detect which parts of the workspace changed, so each crate's heavy jobs run
  # only when relevant. Uses the PR base..head diff via the API — no checkout or
  # submodule needed. The convenience outputs encode the "shared ⟹ everything"
  # rule so downstream `if:` expressions stay short.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Any workspace Rust/build job (iso3166, logging, money, snap, or shared infra).
      rust: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.money == 'true' || steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' }}
      # iso3166-specific work (its sources, or shared infra).
      iso: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.shared == 'true' }}
      # logging-specific work (its sources, or shared infra).
      log: ${{ steps.filter.outputs.logging == 'true' || steps.filter.outputs.shared == 'true' }}
      # money-specific work (kamu-money-core's sources, or shared infra).
      money: ${{ steps.filter.outputs.money == 'true' || steps.filter.outputs.shared == 'true' }}
      # snap-specific work (any kamu-snap-* crate, or shared infra). Umbrella on
      # purpose: the 6 snap crates inter-depend, so a base-crate change must
      # re-run the dependents' jobs. Release independence is preserved by the
      # per-crate dry-run/coverage jobs + per-crate release tags, not the trigger.
      snap: ${{ steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' }}
      # Doc/lint job: any crate, shared infra, or pure docs.
      lint: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.money == 'true' || steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      # `push` events diff before..after against the local git repo, so a
      # checkout is required there (pull_request events use the API and need
      # none). fetch-depth: 0 guarantees the base commit is present for the diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Per-crate source filters trip that crate's heavy jobs; any `*.md`
          # change trips `docs` -> lint-docs. Do NOT add `!**/*.md` negation
          # rules here: under dorny/paths-filter's default
          # `predicate-quantifier: some`, a negated rule matches every file that
          # ISN'T the excluded one, so the filter goes `true` for unrelated
          # changes (a root README edit would then run every crate's jobs). The
          # cost of omitting them is that a crate's own README change also runs
          # that crate's jobs (correct anyway — the README is packaged on
          # `cargo publish`). A root-level `*.md`-only change runs `lint-docs` alone.
          filters: |
            iso3166:
              - 'crates/iso3166/**'
            logging:
              - 'crates/logging/**'
            money:
              - 'crates/money-core/**'
            snap:
              - 'crates/snap-*/**'
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'taplo.toml'
              - 'typos.toml'
              - '.cargo/**'
              # .config/nextest.toml decides how EVERY test runs (isolation,
              # timeouts, fail-fast, retries), so a change to it has to re-run
              # every crate's tests — not nothing, which is what happens to a
              # path no filter lists.
              - '.config/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'taplo.toml'
              - 'typos.toml'

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt-rust-check

  clippy-workspace:
    name: clippy (workspace)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy-workspace

  clippy-iso3166:
    name: clippy (kamu-iso3166 pedantic)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy-iso3166

  clippy-logging:
    name: clippy (kamu-logging features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy-logging

  clippy-snap:
    name: clippy (kamu-snap-* features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy-snap

  test-workspace:
    name: test (${{ matrix.toolchain }})
    needs: [changes, fmt, clippy-workspace]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.94.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          # kamu-money-core's trybuild goldens quote standard-library source, so
          # its compile-fail suite fails for an unrelated reason without this.
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # `just test-all` — the same recipe `just gate` runs, so a green gate and a
      # green CI test job mean the same thing. It covers the workspace plus the
      # feature permutations a default run never reaches (kamu-logging with-otlp,
      # kamu-snap-* all-features), each under cargo-nextest, then the doctests
      # nextest cannot run.
      - run: just test-all

  test-iso3166-features:
    name: test (kamu-iso3166 feature permutations)
    needs: [changes, fmt, clippy-iso3166]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: just test-iso3166

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just build-nostd

  build-wasm:
    name: wasm build (wasm32-unknown-unknown)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just build-wasm

  docs-workspace:
    name: docs (workspace)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just doc-workspace

  docs-iso3166:
    name: docs (kamu-iso3166 all-features)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just doc-iso3166

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Runs the same `just deny` (`cargo deny --all-features check`) as the local
      # gate, with the latest cargo-deny from taiki-e/install-action — so the CI
      # and local invocations are byte-identical (no version/flag drift). This
      # replaces EmbarkStudios/cargo-deny-action@v2: its floating tag began
      # bundling a cargo-deny whose CLI the action's entrypoint orders wrongly
      # (`error: unrecognized subcommand 'warn'`), and dependabot would re-bump any
      # pin straight back to the broken version.
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - run: just deny

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@v2
        with:
          tool: just,taplo-cli,typos-cli
      # markdownlint-cli2 -> node_modules/.bin, which the Justfile prepends to PATH.
      - run: npm install --no-fund --no-audit
      - run: just lint-docs

  publish-dry-run-iso3166:
    name: cargo publish --dry-run (kamu-iso3166)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just publish-dry kamu-iso3166

  publish-dry-run-logging:
    name: cargo publish --dry-run (kamu-logging)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just publish-dry kamu-logging

  coverage-iso3166:
    name: coverage (kamu-iso3166 >= 98% lines)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # cargo-nextest is required: the cov-* recipes measure through
          # `cargo llvm-cov nextest`, so coverage runs the same binaries the
          # same way `just test-all` does.
          tool: just,cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # `just cov` enforces the 98% floor and writes target/lcov.info.
      - run: just cov
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-iso3166
          path: target/lcov.info

  coverage-logging:
    name: coverage (kamu-logging >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # cargo-nextest is required: the cov-* recipes measure through
          # `cargo llvm-cov nextest`, so coverage runs the same binaries the
          # same way `just test-all` does.
          tool: just,cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: just cov-logging

  build-wasm-snap:
    name: wasm build (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just build-wasm-snap

  coverage-snap-crypto:
    name: coverage (kamu-snap-crypto >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # cargo-nextest is required: the cov-* recipes measure through
          # `cargo llvm-cov nextest`, so coverage runs the same binaries the
          # same way `just test-all` does.
          tool: just,cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: just cov-snap-crypto

  coverage-snap-response:
    name: coverage (kamu-snap-response >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # cargo-nextest is required: the cov-* recipes measure through
          # `cargo llvm-cov nextest`, so coverage runs the same binaries the
          # same way `just test-all` does.
          tool: just,cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      - run: just cov-snap-response

  publish-dry-run-snap-crypto:
    name: cargo publish --dry-run (kamu-snap-crypto)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # Only the leaf crate can be dry-run pre-publish (see Justfile `publish-all`).
      - run: just publish-dry kamu-snap-crypto

  # Single aggregate gate (scatter -> gather -> and-gate). This is the ONLY
  # context the branch ruleset requires: it always runs (so the context is always
  # created), and `re-actors/alls-green` passes when every needed job either
  # succeeded or was a path-filtered skip, and fails if any job failed/cancelled.
  # Adding/renaming/splitting jobs above never needs a ruleset edit again — only
  # this `needs:` list (and `allowed-skips`) changes.
  clippy-money:
    name: clippy (kamu-money-core features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just clippy-money

  test-money:
    name: test (kamu-money-core features)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `just test-money` owns tests/compile_fail.rs, whose trybuild goldens
          # quote standard-library source. Without rust-src those cases fail for
          # a reason that says nothing about the code.
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # Docker-free feature permutations plus the doctests nextest cannot run.
      # The trybuild suite runs HERE and not in test-workspace, because its
      # goldens can only ever match one rustc and that job also runs on the MSRV
      # toolchain.
      - run: just test-money

  test-money-db:
    name: test (kamu-money-core database suites)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # Each test here starts its own PostgreSQL testcontainer; ubuntu-latest
      # ships a working Docker daemon. Concurrency is bounded at two by the
      # `money-db` test group in .config/nextest.toml, not by anything here.
      - run: just test-money-db

  docs-money:
    name: docs (kamu-money-core all-features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      - run: just doc-money

  coverage-money:
    name: coverage (kamu-money-core >= 80% lines)
    needs: changes
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          # cargo-nextest is required: the cov-* recipes measure through
          # `cargo llvm-cov nextest`, so coverage runs the same binaries the
          # same way `just test-all` does.
          tool: just,cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # The floor is 80 against a measured 84.89%. It is not higher because this
      # gate excludes the container-backed suites, which are exactly what
      # exercises the two driver adapters — see the recipe's own comment.
      - run: just cov-money

  publish-dry-run-money:
    name: cargo publish --dry-run (kamu-money-core)
    needs: changes
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: Swatinem/rust-cache@v2
      # Proves the packaged archive still builds — which for this crate also
      # proves `vendor/list-one.xml` is inside it, because the build script
      # cannot generate the register without it.
      - run: just publish-dry kamu-money-core

  ci-success:
    name: ci-success
    needs:
      - changes
      - fmt
      - clippy-workspace
      - clippy-iso3166
      - clippy-logging
      - clippy-snap
      - test-workspace
      - test-iso3166-features
      - no-std-build
      - build-wasm
      - docs-workspace
      - docs-iso3166
      - deny
      - lint-docs
      - publish-dry-run-iso3166
      - publish-dry-run-logging
      - coverage-iso3166
      - coverage-logging
      - build-wasm-snap
      - coverage-snap-crypto
      - coverage-snap-response
      - publish-dry-run-snap-crypto
      - clippy-money
      - test-money
      - test-money-db
      - docs-money
      - coverage-money
      - publish-dry-run-money
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Every path-filtered leaf is allowed to be `skipped`; `changes` is NOT in
      # the list, so it must always run and succeed. A job that actually
      # fails/cancels still fails the gate — and a cascade-skip can't hide a
      # failure, because the failing job is itself one of these `needs`.
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            fmt,
            clippy-workspace,
            clippy-iso3166,
            clippy-logging,
            clippy-snap,
            test-workspace,
            test-iso3166-features,
            no-std-build,
            build-wasm,
            docs-workspace,
            docs-iso3166,
            deny,
            lint-docs,
            publish-dry-run-iso3166,
            publish-dry-run-logging,
            coverage-iso3166,
            coverage-logging,
            build-wasm-snap,
            coverage-snap-crypto,
            coverage-snap-response,
            publish-dry-run-snap-crypto,
            clippy-money,
            test-money,
            test-money-db,
            docs-money,
            coverage-money,
            publish-dry-run-money
