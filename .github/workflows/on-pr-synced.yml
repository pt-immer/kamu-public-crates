name: On PR Synced

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]



env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  NEXTEST_PROFILE: ci

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      iso: ${{ steps.classify.outputs.iso }}
      log: ${{ steps.classify.outputs.log }}
      money: ${{ steps.classify.outputs.money }}
      snap: ${{ steps.classify.outputs.snap }}
      moneypg: ${{ steps.classify.outputs.moneypg }}
      lint: ${{ steps.classify.outputs.lint }}
      shell: ${{ steps.classify.outputs.shell }}
      worker: ${{ steps.classify.outputs.worker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify every changed path
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BASE"
            head="$PUSH_HEAD"
          fi
          python3 scripts/ci_paths.py emit --base "$base" --head "$head"

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: rustfmt
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - run: just fmt-rust-check

  clippy-workspace:
    name: clippy (workspace)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-workspace

  clippy-iso3166:
    name: clippy (kamu-iso3166 pedantic)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-iso3166

  clippy-logging:
    name: clippy (kamu-logging features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-logging

  clippy-snap:
    name: clippy (kamu-snap-* features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-snap

  test-workspace:
    name: test (${{ matrix.toolchain }})
    needs: [changes, fmt, clippy-workspace]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.94.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # matrix
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-all

  test-iso3166-features:
    name: test (kamu-iso3166 feature permutations)
    needs: [changes, fmt, clippy-iso3166]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-iso3166

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-nostd

  build-wasm:
    name: wasm build (wasm32-unknown-unknown)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-wasm

  docs-workspace:
    name: docs (workspace)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-workspace

  docs-iso3166:
    name: docs (kamu-iso3166 all-features)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-iso3166

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just deny

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,taplo-cli@0.10.0,typos-cli@1.48.0
      - run: npm ci --no-fund --no-audit
      - run: just lint-docs

  test-repo-policy:
    name: test repository policy
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - run: just test-repo-policy

  check-worker-example:
    name: build Cloudflare Worker example
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/logging/examples/cloudflare-worker
      - run: just check-worker-example

  check-examples:
    name: check examples
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just check-examples

  publish-dry-run:
    name: cargo publish --dry-run (all publishable packages)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just publish-all

  coverage-iso3166:
    name: coverage (kamu-iso3166)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-iso3166
          path: target/lcov.info

  coverage-logging:
    name: coverage (kamu-logging)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-logging

  build-wasm-snap:
    name: wasm build (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-wasm-snap

  coverage-snap-crypto:
    name: coverage (kamu-snap-crypto)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-snap-crypto

  coverage-snap-response:
    name: coverage (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-snap-response

  clippy-money:
    name: clippy (kamu-money-core features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-money

  test-money:
    name: test (kamu-money-core features)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: rust-src
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-money

  test-money-db:
    name: test (kamu-money-core database suites)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-money-db

  docs-money:
    name: docs (kamu-money-core all-features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-money

  coverage-money:
    name: coverage (kamu-money-core)
    needs: changes
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-money


  lint-shell:
    name: lint shell (shellcheck)
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,shellcheck@0.11.0
      - run: just lint-shell

  deny-money-pg:
    name: cargo-deny (kamu-money-pg lane)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-deny@0.20.2
      - run: just pg deny

  test-money-pg-offline:
    name: test (kamu-money-pg hygiene guards)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-nextest@0.9.140
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - run: just pg fmt-check
      - run: just pg test-hygiene
      # The lane's negative controls. They live behind `gate-offline` locally, which no CI job
      # runs, so without this step a control could stop firing and merge green -- and a control
      # that never runs is indistinguishable from one that cannot fail.
      - run: just pg selftest-all

  miri-money-pg:
    name: miri (kamu-money-pg safe payload)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # nightly
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - run: just pg miri-payload

  lint-money-pg:
    name: clippy (kamu-money-pg pg18)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-pgrx@0.19.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - name: Install PostgreSQL 18 server headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-server-dev-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pgrx
          key: pgrx-0.19.2-pg18-${{ runner.os }}
      - name: Initialise PGRX_HOME against the installed server
        run: just pg pgrx-init /usr/lib/postgresql/18/bin/pg_config
      - run: just pg lint

  docs-money-pg:
    name: docs (kamu-money-pg pg18)
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0,cargo-pgrx@0.19.2
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - name: Install PostgreSQL 18 server headers
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-server-dev-18
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pgrx
          key: pgrx-0.19.2-pg18-${{ runner.os }}
      - name: Initialise PGRX_HOME against the installed server
        run: just pg pgrx-init /usr/lib/postgresql/18/bin/pg_config
      # This runs `doc-pg` itself, both against a probed tree and against a clean one, so a
      # separate `doc-pg` step here would be a second full rustdoc pass proving nothing more.
      - run: just pg doc-gate-selftest

  test-money-pg-matrix:
    name: test (kamu-money-pg PG${{ matrix.pg }})
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      # NO BUILD CACHE HERE, and the arithmetic is why. Each cached target costs about 1.6 GiB per
      # manifest state against a 10 GB repository cache, and a branch plus a pull request touching a
      # manifest are two live states, so caching five targets wants ~15.8 GiB of that 10 GB. Over
      # the limit, saves are refused outright and every run rebuilds the layer whose stale near-miss
      # it just paid to download -- strictly worse than not caching at all.
      #
      # The budget therefore buys one target, and it buys the most it can there: these jobs run in
      # PARALLEL, so an uncached major sets the pace whether or not its siblings are cached, while
      # the YugabyteDB job is the longest and alone. Caching a major would spend 1.6 GiB to move a
      # job that is not the critical path.
      #
      # `test-matrix.sh` keeps the dependency layer regardless; only the export is dropped. Editing
      # lane source still recompiles kamu-money-pg and nothing beneath it.
      - run: just pg test-pg "${{ matrix.pg }}"

  test-money-pg-yb:
    name: test (kamu-money-pg YugabyteDB)
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@1.57.0
      # Exporting a build cache needs the docker-container driver; the default one cannot.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Same shape as the PostgreSQL matrix, over the files the YugabyteDB dependency layer copies.
      # YB-PINNED.txt joins them because the base image is the bottom of that layer chain, and
      # probe-yb-abi.sh because it is copied and run above the compile. `crates/money-core/**` and
      # the root lockfile are inputs for the same reason they are in the matrix key: the normalized
      # core package is copied into this layer.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/kmoney_buildx
          key: >-
            buildx-money-pg-yb-${{ hashFiles(
            'Cargo.lock',
            'crates/money-core/**',
            'extensions/money-pg/Cargo.lock',
            'extensions/money-pg/Cargo.toml',
            'extensions/money-pg/rust-toolchain.toml',
            'extensions/money-pg/.cargo/config.toml',
            'extensions/money-pg/kamu-money-pg/Cargo.toml',
            'extensions/money-pg/kamu-money-pg/build.rs',
            'extensions/money-pg/kamu-money-pg/yb/Dockerfile',
            'extensions/money-pg/kamu-money-pg/yb/probe-yb-abi.sh',
            'extensions/money-pg/kamu-money-pg/yb/YB-PINNED.txt',
            'extensions/money-pg/scripts/assert-core-resolution.sh',
            'extensions/money-pg/hygiene/Cargo.toml') }}
          restore-keys: |
            buildx-money-pg-yb-
      - run: just pg test-yb-regress
        env:
          KMONEY_BUILD_CACHE_DIR: /tmp/kmoney_buildx

  ci-success:
    name: ci-success
    needs:
      - changes
      - fmt
      - clippy-workspace
      - clippy-iso3166
      - clippy-logging
      - clippy-snap
      - test-workspace
      - test-iso3166-features
      - no-std-build
      - build-wasm
      - docs-workspace
      - docs-iso3166
      - deny
      - lint-docs
      - test-repo-policy
      - check-worker-example
      - check-examples
      - publish-dry-run
      - coverage-iso3166
      - coverage-logging
      - build-wasm-snap
      - coverage-snap-crypto
      - coverage-snap-response
      - clippy-money
      - test-money
      - test-money-db
      - docs-money
      - coverage-money
      - lint-shell
      - deny-money-pg
      - test-money-pg-offline
      - miri-money-pg
      - lint-money-pg
      - docs-money-pg
      - test-money-pg-matrix
      - test-money-pg-yb
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            fmt,
            clippy-workspace,
            clippy-iso3166,
            clippy-logging,
            clippy-snap,
            test-workspace,
            test-iso3166-features,
            no-std-build,
            build-wasm,
            docs-workspace,
            docs-iso3166,
            deny,
            lint-docs,
            test-repo-policy,
            check-worker-example,
            check-examples,
            publish-dry-run,
            coverage-iso3166,
            coverage-logging,
            build-wasm-snap,
            coverage-snap-crypto,
            coverage-snap-response,
            clippy-money,
            test-money,
            test-money-db,
            docs-money,
            coverage-money,
            lint-shell,
            deny-money-pg,
            test-money-pg-offline,
            miri-money-pg,
            lint-money-pg,
            docs-money-pg,
            test-money-pg-matrix,
            test-money-pg-yb
