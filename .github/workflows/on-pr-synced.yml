name: On PR Synced

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Also run post-merge on main so the CI badge reflects the integration branch
  # and main keeps a green signal. On push, paths-filter diffs before..after, so
  # the same per-crate gating applies. (ci-success on push is signal-only — the
  # branch ruleset's required check applies to PR merges, not pushes.)
  push:
    branches: [main]

# NOTE: no workflow-level `paths:` filter — that would prevent the check
# contexts from being created on unrelated PRs, leaving any required status
# check stuck "Expected" forever. Gating happens at the JOB level via `if:`
# (a skipped required job is treated as success), and a single always-running
# `ci-success` aggregate gate is the one context the branch ruleset requires.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Detect which parts of the workspace changed, so each crate's heavy jobs run
  # only when relevant. Uses the PR base..head diff via the API — no checkout or
  # submodule needed. The convenience outputs encode the "shared ⟹ everything"
  # rule so downstream `if:` expressions stay short.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Any workspace Rust/build job (iso3166, logging, snap, or shared infra).
      rust: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' }}
      # iso3166-specific work (its sources, or shared infra).
      iso: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.shared == 'true' }}
      # logging-specific work (its sources, or shared infra).
      log: ${{ steps.filter.outputs.logging == 'true' || steps.filter.outputs.shared == 'true' }}
      # snap-specific work (any kamu-snap-* crate, or shared infra). Umbrella on
      # purpose: the 6 snap crates inter-depend, so a base-crate change must
      # re-run the dependents' jobs. Release independence is preserved by the
      # per-crate dry-run/coverage jobs + per-crate release tags, not the trigger.
      snap: ${{ steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' }}
      # Doc/lint job: any crate, shared infra, or pure docs.
      lint: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.snap == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      # `push` events diff before..after against the local git repo, so a
      # checkout is required there (pull_request events use the API and need
      # none). fetch-depth: 0 guarantees the base commit is present for the diff.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Per-crate source filters trip that crate's heavy jobs; any `*.md`
          # change trips `docs` -> lint-docs. Do NOT add `!**/*.md` negation
          # rules here: under dorny/paths-filter's default
          # `predicate-quantifier: some`, a negated rule matches every file that
          # ISN'T the excluded one, so the filter goes `true` for unrelated
          # changes (a root README edit would then run every crate's jobs). The
          # cost of omitting them is that a crate's own README change also runs
          # that crate's jobs (correct anyway — the README is packaged on
          # `cargo publish`). A root-level `*.md`-only change runs `lint-docs` alone.
          filters: |
            iso3166:
              - 'crates/iso3166/**'
            logging:
              - 'crates/logging/**'
            snap:
              - 'crates/snap-*/**'
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'taplo.toml'
              - 'typos.toml'
              - '.cargo/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'taplo.toml'
              - 'typos.toml'

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-workspace:
    name: clippy (workspace)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace-wide: deny warnings + clippy::all (default features — logging's
      # `systemd`/`wasm32` features are mutually exclusive, so `--all-features`
      # cannot be used across the whole workspace).
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::all

  clippy-iso3166:
    name: clippy (kamu-iso3166 pedantic)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # kamu-iso3166 additionally holds to clippy::pedantic.
      - run: cargo clippy -p kamu-iso3166 --all-features --all-targets -- -D clippy::pedantic

  test-workspace:
    name: test (${{ matrix.toolchain }})
    needs: [changes, fmt, clippy-workspace]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-iso3166-features:
    name: test (kamu-iso3166 feature permutations)
    needs: [changes, fmt, clippy-iso3166]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kamu-iso3166 --all-features
      - run: cargo test -p kamu-iso3166 --no-default-features --features serde

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kamu-iso3166 --no-default-features --target thumbv7em-none-eabi

  build-wasm:
    name: wasm build (wasm32-unknown-unknown)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kamu-logging --no-default-features --features wasm32 --target wasm32-unknown-unknown

  docs-workspace:
    name: docs (workspace)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  docs-iso3166:
    name: docs (kamu-iso3166 all-features)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc -p kamu-iso3166 --no-deps --all-features

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli
      - run: npm install --no-fund --no-audit
      - run: npx markdownlint-cli2 "**/*.md"
      - run: taplo fmt --check
      - run: taplo lint
      - run: typos

  publish-dry-run-iso3166:
    name: cargo publish --dry-run (kamu-iso3166)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p kamu-iso3166 --dry-run

  publish-dry-run-logging:
    name: cargo publish --dry-run (kamu-logging)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p kamu-logging --dry-run

  coverage-iso3166:
    name: coverage (kamu-iso3166 >= 98% lines)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Generated tables and the build script are excluded from the denominator.
      - run: >
          cargo llvm-cov -p kamu-iso3166 --all-features
          --ignore-filename-regex 'generated|build/'
          --fail-under-lines 98
          --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-iso3166
          path: lcov.info

  coverage-logging:
    name: coverage (kamu-logging >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # kamu-logging's global-subscriber + journald/tty branches are
      # environment-bound and can't be reached on a headless runner, so its gate
      # is lower. It can't use --all-features (systemd XOR wasm32).
      - run: cargo llvm-cov -p kamu-logging --fail-under-lines 70

  build-wasm-snap:
    name: wasm build (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # kamu-snap-response is wasm-clean; kamu-snap-crypto is NOT (rsa -> getrandom
      # needs the consumer's `js` feature), so only response is built for wasm32.
      - run: cargo check -p kamu-snap-response --no-default-features --target wasm32-unknown-unknown

  coverage-snap-crypto:
    name: coverage (kamu-snap-crypto >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Floor is the measured ~74% rounded down; the default-on `webhook`
      # providers ship without tests upstream (raising this is future work).
      - run: cargo llvm-cov -p kamu-snap-crypto --all-features --fail-under-lines 70

  coverage-snap-response:
    name: coverage (kamu-snap-response >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The 4 thin actix/axum adapter crates have no tests (framework glue);
      # they are compile-only via the workspace jobs, not coverage-gated.
      - run: cargo llvm-cov -p kamu-snap-response --all-features --fail-under-lines 70

  publish-dry-run-snap-crypto:
    name: cargo publish --dry-run (kamu-snap-crypto)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the leaf crate can be dry-run pre-publish. kamu-snap-response and the
      # 4 adapter crates declare an in-workspace dependency (kamu-snap-crypto /
      # kamu-snap-response) that cargo's package step requires to already exist on
      # crates.io — even when it is optional, and even with --no-verify. They are
      # validated by the workspace clippy/test/docs jobs and published in
      # dependency order (see on-release-published.yml), so they get no dry-run job.
      - run: cargo publish -p kamu-snap-crypto --dry-run

  # Single aggregate gate (scatter -> gather -> and-gate). This is the ONLY
  # context the branch ruleset requires: it always runs (so the context is always
  # created), and `re-actors/alls-green` passes when every needed job either
  # succeeded or was a path-filtered skip, and fails if any job failed/cancelled.
  # Adding/renaming/splitting jobs above never needs a ruleset edit again — only
  # this `needs:` list (and `allowed-skips`) changes.
  ci-success:
    name: ci-success
    needs:
      - changes
      - fmt
      - clippy-workspace
      - clippy-iso3166
      - test-workspace
      - test-iso3166-features
      - no-std-build
      - build-wasm
      - docs-workspace
      - docs-iso3166
      - deny
      - lint-docs
      - publish-dry-run-iso3166
      - publish-dry-run-logging
      - coverage-iso3166
      - coverage-logging
      - build-wasm-snap
      - coverage-snap-crypto
      - coverage-snap-response
      - publish-dry-run-snap-crypto
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Every path-filtered leaf is allowed to be `skipped`; `changes` is NOT in
      # the list, so it must always run and succeed. A job that actually
      # fails/cancels still fails the gate — and a cascade-skip can't hide a
      # failure, because the failing job is itself one of these `needs`.
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            fmt,
            clippy-workspace,
            clippy-iso3166,
            test-workspace,
            test-iso3166-features,
            no-std-build,
            build-wasm,
            docs-workspace,
            docs-iso3166,
            deny,
            lint-docs,
            publish-dry-run-iso3166,
            publish-dry-run-logging,
            coverage-iso3166,
            coverage-logging,
            build-wasm-snap,
            coverage-snap-crypto,
            coverage-snap-response,
            publish-dry-run-snap-crypto
