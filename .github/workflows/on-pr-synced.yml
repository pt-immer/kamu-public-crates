name: On PR Synced

on:
  pull_request:
    types: [opened, synchronize, reopened]

# NOTE: no workflow-level `paths:` filter — that would prevent the check
# contexts from being created on unrelated PRs, leaving any required status
# check stuck "Expected" forever. Gating happens at the JOB level via `if:`
# (a skipped required job is treated as success), and a single always-running
# `ci-success` aggregate gate is the one context the branch ruleset requires.

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

permissions:
  contents: read

jobs:
  # Detect which parts of the workspace changed, so each crate's heavy jobs run
  # only when relevant. Uses the PR base..head diff via the API — no checkout or
  # submodule needed. The convenience outputs encode the "shared ⟹ everything"
  # rule so downstream `if:` expressions stay short.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Any workspace Rust/build job (iso3166, logging, or shared infra).
      rust: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.shared == 'true' }}
      # iso3166-specific work (its sources, or shared infra).
      iso: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.shared == 'true' }}
      # logging-specific work (its sources, or shared infra).
      log: ${{ steps.filter.outputs.logging == 'true' || steps.filter.outputs.shared == 'true' }}
      # Doc/lint job: any crate, shared infra, or pure docs.
      lint: ${{ steps.filter.outputs.iso3166 == 'true' || steps.filter.outputs.logging == 'true' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A crate's `*.md`-only change does NOT trip its heavy build (the `!`
          # negation), so docs-only PRs fall through to `lint-docs` alone.
          filters: |
            iso3166:
              - 'crates/iso3166/**'
              - '!crates/iso3166/**/*.md'
            logging:
              - 'crates/logging/**'
              - '!crates/logging/**/*.md'
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Justfile'
              - 'deny.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'taplo.toml'
              - 'typos.toml'
              - '.cargo/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - '.github/dependabot.yml'
            docs:
              - '**/*.md'
              - '.markdownlint-cli2.jsonc'
              - 'taplo.toml'
              - 'typos.toml'

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-workspace:
    name: clippy (workspace)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace-wide: deny warnings + clippy::all (default features — logging's
      # `systemd`/`wasm32` features are mutually exclusive, so `--all-features`
      # cannot be used across the whole workspace).
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::all

  clippy-iso3166:
    name: clippy (kamu-iso3166 pedantic)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # kamu-iso3166 additionally holds to clippy::pedantic.
      - run: cargo clippy -p kamu-iso3166 --all-features --all-targets -- -D clippy::pedantic

  test-workspace:
    name: test (${{ matrix.toolchain }})
    needs: [changes, fmt, clippy-workspace]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-iso3166-features:
    name: test (kamu-iso3166 feature permutations)
    needs: [changes, fmt, clippy-iso3166]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kamu-iso3166 --all-features
      - run: cargo test -p kamu-iso3166 --no-default-features --features serde

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kamu-iso3166 --no-default-features --target thumbv7em-none-eabi

  build-wasm:
    name: wasm build (wasm32-unknown-unknown)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kamu-logging --no-default-features --features wasm32 --target wasm32-unknown-unknown

  docs-workspace:
    name: docs (workspace)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc --workspace --no-deps

  docs-iso3166:
    name: docs (kamu-iso3166 all-features)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: cargo doc -p kamu-iso3166 --no-deps --all-features

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli
      - run: npm install --no-fund --no-audit
      - run: npx markdownlint-cli2 "**/*.md"
      - run: taplo fmt --check
      - run: taplo lint
      - run: typos

  publish-dry-run-iso3166:
    name: cargo publish --dry-run (kamu-iso3166)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p kamu-iso3166 --dry-run

  publish-dry-run-logging:
    name: cargo publish --dry-run (kamu-logging)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p kamu-logging --dry-run

  coverage-iso3166:
    name: coverage (kamu-iso3166 >= 98% lines)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Generated tables and the build script are excluded from the denominator.
      - run: >
          cargo llvm-cov -p kamu-iso3166 --all-features
          --ignore-filename-regex 'generated|build/'
          --fail-under-lines 98
          --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov-iso3166
          path: lcov.info

  coverage-logging:
    name: coverage (kamu-logging >= 70% lines)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # kamu-logging's global-subscriber + journald/tty branches are
      # environment-bound and can't be reached on a headless runner, so its gate
      # is lower. It can't use --all-features (systemd XOR wasm32).
      - run: cargo llvm-cov -p kamu-logging --fail-under-lines 70

  # Single aggregate gate. This is the ONLY context the branch ruleset requires:
  # it always runs (so the context is always created), passes when every needed
  # job succeeded or was skipped, and fails if any failed or was cancelled.
  # Adding/renaming/splitting jobs above never needs a ruleset edit again — only
  # this `needs:` list changes.
  ci-success:
    name: ci-success
    needs:
      - changes
      - fmt
      - clippy-workspace
      - clippy-iso3166
      - test-workspace
      - test-iso3166-features
      - no-std-build
      - build-wasm
      - docs-workspace
      - docs-iso3166
      - deny
      - lint-docs
      - publish-dry-run-iso3166
      - publish-dry-run-logging
      - coverage-iso3166
      - coverage-logging
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify no needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job concluded '$r' — failing the aggregate gate."
              exit 1
            fi
          done
          echo "all needed jobs succeeded or were skipped — ci-success passes."
