name: On PR Synced

# No push trigger: the ruleset requires an up-to-date branch, squash-only merges and linear
# history, so a merge lands the tree this run already certified. Nothing seeds the cache that
# leaves behind either -- that pool is keyed per job, so filling it means running those jobs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:



env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  NEXTEST_PROFILE: ci

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      iso: ${{ steps.classify.outputs.iso }}
      log: ${{ steps.classify.outputs.log }}
      money: ${{ steps.classify.outputs.money }}
      snap: ${{ steps.classify.outputs.snap }}
      moneypg: ${{ steps.classify.outputs.moneypg }}
      lint: ${{ steps.classify.outputs.lint }}
      shell: ${{ steps.classify.outputs.shell }}
      worker: ${{ steps.classify.outputs.worker }}
      manifest: ${{ steps.pins.outputs.manifest }}
      builder_image: ${{ steps.pins.outputs.builder_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: pins
        uses: ./.github/actions/read-dev-tools
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(steps.pins.outputs.manifest).rust.primary }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Classify every changed path
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DISPATCH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE"
              head="$PR_HEAD"
              ;;
            workflow_dispatch)
              # No base: check everything. The empty tree makes every tracked file read as added.
              base="$(git hash-object -t tree /dev/null)"
              head="$DISPATCH_HEAD"
              ;;
            *)
              echo "::error::classify: $EVENT_NAME names no base to diff"
              exit 1
              ;;
          esac
          cargo run -q -p repo-policy --bin ci-paths -- emit --base "$base" --head "$head"

  fmt:
    name: rustfmt
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: rustfmt
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - run: just fmt-rust-check

  clippy-workspace:
    name: clippy (workspace)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-workspace

  clippy-iso3166:
    name: clippy (kamu-iso3166 pedantic)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-iso3166

  clippy-logging:
    name: clippy (kamu-logging features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-logging

  clippy-snap:
    name: clippy (kamu-snap-* features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-snap

  test-workspace:
    name: test (${{ matrix.toolchain }})
    needs: [changes, fmt, clippy-workspace]
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "${{ fromJSON(needs.changes.outputs.manifest).rust.msrv }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-all

  test-iso3166-features:
    name: test (kamu-iso3166 feature permutations)
    needs: [changes, fmt, clippy-iso3166]
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-iso3166

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-nostd

  build-wasm:
    name: wasm build (wasm32-unknown-unknown)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-wasm

  docs-workspace:
    name: docs (workspace)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-workspace

  docs-iso3166:
    name: docs (kamu-iso3166 all-features)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-iso3166

  deny:
    name: cargo-deny
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-deny@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-deny'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just deny

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},taplo-cli@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['taplo-cli'].version }},typos-cli@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['typos-cli'].version }}
      - run: npm ci --no-fund --no-audit
      - run: just lint-docs

  test-policy:
    name: test repository policy
    needs: changes
    if: ${{ needs.changes.outputs.lint == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-policy

  check-worker-example:
    name: build Cloudflare Worker example
    needs: changes
    if: ${{ needs.changes.outputs.worker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: crates/logging/examples/cloudflare-worker
      - run: just check-worker-example

  check-examples:
    name: check examples
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just check-examples

  publish-dry-run:
    name: cargo publish --dry-run (all publishable packages)
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just publish-all

  coverage-iso3166:
    name: coverage (kamu-iso3166)
    needs: changes
    if: ${{ needs.changes.outputs.iso == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-llvm-cov@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-llvm-cov'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-iso3166
          path: target/lcov.info

  coverage-logging:
    name: coverage (kamu-logging)
    needs: changes
    if: ${{ needs.changes.outputs.log == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-llvm-cov@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-llvm-cov'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-logging

  build-wasm-snap:
    name: wasm build (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just build-wasm-snap

  coverage-snap-crypto:
    name: coverage (kamu-snap-crypto)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-llvm-cov@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-llvm-cov'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-snap-crypto

  coverage-snap-response:
    name: coverage (kamu-snap-response)
    needs: changes
    if: ${{ needs.changes.outputs.snap == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-llvm-cov@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-llvm-cov'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-snap-response

  clippy-money:
    name: clippy (kamu-money-core features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: clippy
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just clippy-money

  test-money:
    name: test (kamu-money-core features)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: rust-src
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-money

  test-money-db:
    name: test (kamu-money-core database suites)
    needs: [changes, fmt, clippy-money]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just test-money-db

  docs-money:
    name: docs (kamu-money-core all-features)
    needs: [changes, fmt]
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just doc-money

  coverage-money:
    name: coverage (kamu-money-core)
    needs: changes
    if: ${{ needs.changes.outputs.money == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.primary }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-llvm-cov@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-llvm-cov'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: just cov-money


  lint-shell:
    name: lint shell (shellcheck)
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},shellcheck@${{ fromJSON(needs.changes.outputs.manifest).system_tools['shellcheck'].version }}
      - run: just lint-shell

  deny-money-pg:
    name: cargo-deny (kamu-money-pg lane)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-deny@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-deny'].version }}
      - run: just pg deny

  test-money-pg-offline:
    name: test (kamu-money-pg hygiene guards)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(needs.changes.outputs.manifest).rust.lane }}
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - run: just pg fmt-check
      # This reaches the lane's negative controls too: they are tests in the hygiene crate, so a
      # control cannot be unhooked from the check that runs it without being deleted outright.
      - run: just pg test-hygiene

  miri-money-pg:
    name: miri (kamu-money-pg safe payload)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: nightly
          components: miri
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - run: just pg miri-payload

  lint-money-pg:
    name: clippy (kamu-money-pg)
    needs: changes
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    # The toolchain, cargo-pgrx, the PostgreSQL major and an initialised PGRX_HOME all come from
    # the image, which is where they are already stated. Provisioning them here as well was a
    # second copy of the lane's Dockerfile written in YAML, and it named the major four times.
    container:
      image: ${{ needs.changes.outputs.builder_image }}
      # The workspace is mounted root-owned, and the image's own user is not root. Everything the
      # job runs -- cargo, cargo-pgrx, the initialised PGRX_HOME -- is readable either way.
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - name: Point the lane at the image's initialised PGRX_HOME
        # `.cargo/config.toml` forces PGRX_HOME to `.pgrx` relative to itself, which resolves
        # inside the checkout rather than to the home the image populated.
        run: ln -sfn /home/pgrx/.pgrx extensions/money-pg/.pgrx
      - run: just pg lint

  docs-money-pg:
    name: docs (kamu-money-pg)
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.changes.outputs.builder_image }}
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }},cargo-nextest@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['cargo-nextest'].version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: extensions/money-pg
      - name: Point the lane at the image's initialised PGRX_HOME
        run: ln -sfn /home/pgrx/.pgrx extensions/money-pg/.pgrx
      # This runs `doc-pg` itself, both against a probed tree and against a clean one, so a
      # separate `doc-pg` step here would be a second full rustdoc pass proving nothing more.
      - run: just pg doc-gate-selftest

  test-money-pg-matrix:
    name: test (kamu-money-pg PG${{ matrix.pg }})
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [15, 16, 17, 18]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      # NO BUILD CACHE HERE. These jobs run in PARALLEL, so an uncached major sets the pace
      # whether or not its siblings are cached, while the YugabyteDB job is the longest and
      # alone. Caching a major moves a job that is not the critical path.
      #
      # Whether a size cap also forbids it is UNKNOWN. The arithmetic once written here assumed a
      # 10 GB repository cache and concluded that five targets could not fit; active caches now
      # exceed 10 GB, so the premise is gone and the conclusion does not follow from it. The cap
      # is the missing half: `actions/cache/usage` reports consumption only, and the limit comes
      # from the organization's cache usage policy or this repository's Actions settings.
      # What stays true either way: a target cached and then evicted is worse than one never
      # cached, because each run pays to download a stale near-miss and rebuilds the layer anyway.
      #
      # `test-matrix.sh` keeps the dependency layer regardless; only the export is dropped. Editing
      # lane source still recompiles kamu-money-pg and nothing beneath it.
      - run: just pg test-pg "${{ matrix.pg }}"

  test-money-pg-yb:
    name: test (kamu-money-pg YugabyteDB)
    needs: [changes, lint-money-pg]
    if: ${{ needs.changes.outputs.moneypg == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(needs.changes.outputs.manifest).cargo_tools['just'].version }}
      # Exporting a build cache needs the docker-container driver; the default one cannot.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Same shape as the PostgreSQL matrix, over the files the YugabyteDB dependency layer copies.
      # YB-PINNED.txt joins them because the base image is the bottom of that layer chain, and
      # probe-yb-abi.sh because it is copied and run above the compile. `crates/money-core/**` and
      # the root lockfile are inputs for the same reason they are in the matrix key: the normalized
      # core package is copied into this layer.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/kmoney_buildx
          key: >-
            buildx-money-pg-yb-${{ hashFiles(
            'Cargo.lock',
            'crates/money-core/**',
            'extensions/money-pg/Cargo.lock',
            'extensions/money-pg/Cargo.toml',
            'extensions/money-pg/rust-toolchain.toml',
            'extensions/money-pg/.cargo/config.toml',
            'extensions/money-pg/kamu-money-pg/Cargo.toml',
            'extensions/money-pg/kamu-money-pg/build.rs',
            'extensions/money-pg/kamu-money-pg/yb/Dockerfile',
            'extensions/money-pg/kamu-money-pg/yb/probe-yb-abi.sh',
            'extensions/money-pg/kamu-money-pg/yb/YB-PINNED.txt',
            'extensions/money-pg/scripts/assert-core-resolution.sh',
            'extensions/money-pg/hygiene/Cargo.toml') }}
          restore-keys: |
            buildx-money-pg-yb-
      - run: just pg test-yb-regress
        env:
          KMONEY_BUILD_CACHE_DIR: /tmp/kmoney_buildx

  ci-success:
    name: ci-success
    needs:
      - changes
      - fmt
      - clippy-workspace
      - clippy-iso3166
      - clippy-logging
      - clippy-snap
      - test-workspace
      - test-iso3166-features
      - no-std-build
      - build-wasm
      - docs-workspace
      - docs-iso3166
      - deny
      - lint-docs
      - test-policy
      - check-worker-example
      - check-examples
      - publish-dry-run
      - coverage-iso3166
      - coverage-logging
      - build-wasm-snap
      - coverage-snap-crypto
      - coverage-snap-response
      - clippy-money
      - test-money
      - test-money-db
      - docs-money
      - coverage-money
      - lint-shell
      - deny-money-pg
      - test-money-pg-offline
      - miri-money-pg
      - lint-money-pg
      - docs-money-pg
      - test-money-pg-matrix
      - test-money-pg-yb
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: >-
            fmt,
            clippy-workspace,
            clippy-iso3166,
            clippy-logging,
            clippy-snap,
            test-workspace,
            test-iso3166-features,
            no-std-build,
            build-wasm,
            docs-workspace,
            docs-iso3166,
            deny,
            lint-docs,
            test-policy,
            check-worker-example,
            check-examples,
            publish-dry-run,
            coverage-iso3166,
            coverage-logging,
            build-wasm-snap,
            coverage-snap-crypto,
            coverage-snap-response,
            clippy-money,
            test-money,
            test-money-db,
            docs-money,
            coverage-money,
            lint-shell,
            deny-money-pg,
            test-money-pg-offline,
            miri-money-pg,
            lint-money-pg,
            docs-money-pg,
            test-money-pg-matrix,
            test-money-pg-yb
