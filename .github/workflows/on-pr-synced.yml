name: On PR Synced

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Workspace-wide: deny warnings + clippy::all (default features — logging's
      # `systemd`/`wasm32` features are mutually exclusive, so `--all-features`
      # cannot be used across the whole workspace).
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::all
      # kamu-iso3166 additionally holds to clippy::pedantic.
      - run: cargo clippy -p kamu-iso3166 --all-features --all-targets -- -D clippy::pedantic

  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, "1.85.0"]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo test -p kamu-iso3166 --all-features
      - run: cargo test -p kamu-iso3166 --no-default-features --features serde

  no-std-build:
    name: no_std build (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kamu-iso3166 --no-default-features --target thumbv7em-none-eabi

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -Dwarnings
        run: |
          cargo doc --workspace --no-deps
          cargo doc -p kamu-iso3166 --no-deps --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: EmbarkStudios/cargo-deny-action@v2

  lint-docs:
    name: lint docs (markdown / toml / spelling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo-cli,typos-cli
      - run: npm install --no-fund --no-audit
      - run: npx markdownlint-cli2 "**/*.md"
      - run: taplo fmt --check
      - run: taplo lint
      - run: typos

  publish-dry-run:
    name: cargo publish --dry-run
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: [kamu-iso3166, kamu-logging]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p ${{ matrix.crate }} --dry-run

  coverage:
    name: coverage (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # The data-heavy crate carries the coverage gate; generated tables and the
      # build script are excluded from the denominator.
      - run: >
          cargo llvm-cov -p kamu-iso3166 --all-features
          --ignore-filename-regex 'generated|build/'
          --fail-under-lines 95
          --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info
