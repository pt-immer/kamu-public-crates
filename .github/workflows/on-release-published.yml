name: On Release Published


on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - id: pins
        uses: ./.github/actions/read-dev-tools
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(steps.pins.outputs.manifest).rust.primary }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Parse release tag -> crate + version
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^(kamu-iso3166|kamu-logging|kamu-money-core|kamu-snap-crypto|kamu-snap-crypto-actix|kamu-snap-crypto-axum|kamu-snap-response|kamu-snap-response-actix|kamu-snap-response-axum)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?)$ ]]; then
            echo "crate=${BASH_REMATCH[1]}"  >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "publishable=true"          >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^(kamu-money-pg)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?)$ ]]; then
            echo "crate=${BASH_REMATCH[1]}"  >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "publishable=false"         >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release tag '$TAG' must match '<crate>-vX.Y.Z' (crate ∈ {kamu-iso3166, kamu-logging, kamu-money-core, kamu-money-pg, kamu-snap-crypto, kamu-snap-crypto-actix, kamu-snap-crypto-axum, kamu-snap-response, kamu-snap-response-actix, kamu-snap-response-axum})"
            exit 1
          fi

      - name: Verify Cargo.toml version matches the tag
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          VERSION: ${{ steps.parse.outputs.version }}
          PUBLISHABLE: ${{ steps.parse.outputs.publishable }}
        run: |
          if [[ "$PUBLISHABLE" == "false" ]]; then
            META_ARGS=(--manifest-path extensions/money-pg/Cargo.toml)
          else
            META_ARGS=()
          fi
          MANIFEST_VER="$(cargo metadata --no-deps --format-version 1 "${META_ARGS[@]}" \
            | python3 -c "import json,sys,os; m=json.load(sys.stdin); print(next(p['version'] for p in m['packages'] if p['name']==os.environ['CRATE']))")"
          echo "manifest=$MANIFEST_VER tag=$VERSION"
          if [[ "$MANIFEST_VER" != "$VERSION" ]]; then
            echo "::error::$CRATE Cargo.toml version ($MANIFEST_VER) != release tag version ($VERSION)"
            exit 1
          fi

      - name: Verify the tag commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::release tag '$TAG' points to $tag_commit, which is not an ancestor of origin/main"
            exit 1
          fi

      - name: Stop before crates.io for a crate that cannot be published
        if: ${{ steps.parse.outputs.publishable == 'false' }}
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          echo "::notice title=Not a crates.io package::${CRATE} ${VERSION} is a PostgreSQL extension. Its root Cargo patch cannot ship in a .crate, so this workflow verified the tag but will not use the registry token."
          echo "The deployable artifact is the consumer-owned YugabyteDB node image. See extensions/money-pg/DESIGN.md."

      - name: Ensure the version is not already on crates.io
        if: ${{ steps.parse.outputs.publishable == 'true' }}
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: python3 scripts/crates_io.py ensure-absent "$CRATE" "$VERSION"

      - name: Verify in-workspace kamu-snap-* deps are already published
        if: ${{ steps.parse.outputs.publishable == 'true' }}
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
        run: |
          deps="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys,os; m=json.load(sys.stdin); p=next(x for x in m['packages'] if x['name']==os.environ['CRATE']); print('\n'.join(f'{d[\"name\"]}\t{d[\"req\"]}' for d in sorted(p['dependencies'], key=lambda d: d['name']) if d['name'].startswith('kamu-snap-')))")"
          if [ -z "$deps" ]; then echo "no in-workspace kamu-snap-* deps."; exit 0; fi
          while IFS=$'\t' read -r dependency requirement; do
            python3 scripts/crates_io.py require "$dependency" "$requirement" && continue
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::could not read the crates.io index; whether '${dependency}' satisfies '${requirement}' is unknown"
            else
              echo "::error::dependency '${dependency}' has no published version satisfying '${requirement}' — publish it before ${CRATE}. Order: kamu-snap-crypto -> kamu-snap-response -> adapters."
            fi
            exit "$status"
          done <<< "$deps"

      - name: Publish (dry-run, then for real)
        if: ${{ steps.parse.outputs.publishable == 'true' }}
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.SECRET_DEPLOY_CRATEIO }}
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -euo pipefail
          retry() {
            local n=1 max=3
            until "$@"; do
              local code=$?
              if [ "$n" -ge "$max" ]; then
                echo "::error::'$*' failed after $max attempts (exit $code)"; return "$code"
              fi
              echo "::warning::attempt $n of '$*' failed (exit $code); retrying in $((n * 15))s…"
              sleep $((n * 15)); n=$((n + 1))
            done
          }
          retry cargo publish -p "$CRATE" --dry-run
          cargo publish -p "$CRATE"

      - name: Ensure github:pt-immer:rust-devs co-owns the crate
        if: ${{ steps.parse.outputs.publishable == 'true' }}
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.SECRET_DEPLOY_CRATEIO }}
        run: |
          set -uo pipefail
          if out="$(cargo owner --add github:pt-immer:rust-devs "$CRATE" 2>&1)"; then
            echo "$out"; echo "added github:pt-immer:rust-devs to $CRATE"
          elif echo "$out" | grep -qiE 'already (an )?owner|already invited'; then
            echo "$out"; echo "github:pt-immer:rust-devs already owns $CRATE"
          else
            echo "$out"
            echo "::warning::could not add github:pt-immer:rust-devs to $CRATE (token may lack the crates.io change-owners scope); add it manually or via the Add Crate Owner workflow"
          fi

  # Every other lane suite resolves kamu-money-core through a path patch; this one does not.
  prove-lane-against-published-core:
    name: extension against the published kamu-money-core
    needs: publish
    if: ${{ needs.publish.outputs.crate == 'kamu-money-core' }}
    runs-on: ubuntu-latest
    # Outside the crates-io environment: proves a published crate, holds no publishing token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - id: pins
        uses: ./.github/actions/read-dev-tools
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: just@${{ fromJSON(steps.pins.outputs.manifest).cargo_tools['just'].version }}

      # The lane depends on a requirement, not on whichever version was published last. A release
      # outside that requirement is one this lane does not consume, and compiling against the
      # version it does still resolve would report a different crate as proven.
      - name: Determine whether the lane consumes this release
        id: consumes
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          requirement="$(cargo metadata --no-deps --format-version 1 \
            --manifest-path extensions/money-pg/Cargo.toml \
            | jq -r 'first(.packages[] | select(.name == "kamu-money-pg") | .dependencies[]
                     | select(.name == "kamu-money-core") | .req)')"
          if [ -z "$requirement" ]; then
            echo "::error::kamu-money-pg declares no kamu-money-core dependency to read"
            exit 1
          fi
          echo "lane requires kamu-money-core '${requirement}'"
          verdict="$(python3 scripts/crates_io.py matches "$requirement" "$VERSION")"
          echo "$verdict"
          case "$verdict" in
            *=true)
              echo "consumes=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "consumes=false" >> "$GITHUB_OUTPUT"
              echo "::notice::kamu-money-core ${VERSION} lies outside the lane's requirement '${requirement}'; this release is not one it consumes"
              ;;
          esac

      - name: Wait for the index to carry the released version
        if: ${{ steps.consumes.outputs.consumes == 'true' }}
        env:
          CRATE: ${{ needs.publish.outputs.crate }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -uo pipefail
          python3 scripts/crates_io.py require "$CRATE" "=${VERSION}" --wait-seconds 300
          status=$?
          case "$status" in
            0) ;;
            2) echo "::error::could not read the crates.io index; whether ${CRATE} ${VERSION} reached it is unknown" ;;
            *) echo "::error::${CRATE} ${VERSION} did not reach the index" ;;
          esac
          exit "$status"

      # The majors run in parallel. Sequentially they are four uncached pgrx builds in one job, and
      # a job killed at the runner's ceiling reports a failure indistinguishable from a real one --
      # after the version is already immutable.
      - name: Compile and test the extension against the registry crate
        if: ${{ steps.consumes.outputs.consumes == 'true' }}
        timeout-minutes: 300
        env:
          KMONEY_USE_LOCAL_CORE: "0"
        run: just pg test-pg-matrix
