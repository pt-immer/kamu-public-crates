name: On Release Published


on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
      - id: pins
        uses: ./.github/actions/read-dev-tools
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07-16
        with:
          toolchain: ${{ fromJSON(steps.pins.outputs.manifest).rust.primary }}
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: just@${{ fromJSON(steps.pins.outputs.manifest).cargo_tools['just'].version }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Parse release tag -> crate + version
        id: parse
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^(kamu-iso3166|kamu-logging|kamu-money-core|kamu-snap-crypto|kamu-snap-crypto-actix|kamu-snap-crypto-axum|kamu-snap-response|kamu-snap-response-actix|kamu-snap-response-axum)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.+-]+)?)$ ]]; then
            echo "crate=${BASH_REMATCH[1]}"  >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release tag '$TAG' must match '<crate>-vX.Y.Z' (crate ∈ {kamu-iso3166, kamu-logging, kamu-money-core, kamu-snap-crypto, kamu-snap-crypto-actix, kamu-snap-crypto-axum, kamu-snap-response, kamu-snap-response-actix, kamu-snap-response-axum})"
            exit 1
          fi

      - name: Verify Cargo.toml version matches the tag
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          MANIFEST_VER="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$CRATE" 'first(.packages[] | select(.name == $crate) | .version)')"
          echo "manifest=$MANIFEST_VER tag=$VERSION"
          if [[ "$MANIFEST_VER" != "$VERSION" ]]; then
            echo "::error::$CRATE Cargo.toml version ($MANIFEST_VER) != release tag version ($VERSION)"
            exit 1
          fi

      - name: Verify the tag commit is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::release tag '$TAG' points to $tag_commit, which is not an ancestor of origin/main"
            exit 1
          fi

      - name: Ensure the version is not already on crates.io
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: just crates-io ensure-absent "$CRATE" "$VERSION"

      - name: Verify in-workspace kamu-snap-* deps are already published
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
        run: |
          deps="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$CRATE" '
                .packages[] | select(.name == $crate) | .dependencies[]
                | select(.name | startswith("kamu-snap-"))
                | [.name, .req] | @tsv' | sort)"
          if [ -z "$deps" ]; then echo "no in-workspace kamu-snap-* deps."; exit 0; fi
          while IFS=$'\t' read -r dependency requirement; do
            just crates-io require "$dependency" "$requirement" && continue
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "::error::could not read the crates.io index; whether '${dependency}' satisfies '${requirement}' is unknown"
            else
              echo "::error::dependency '${dependency}' has no published version satisfying '${requirement}' — publish it before ${CRATE}. Order: kamu-snap-crypto -> kamu-snap-response -> adapters."
            fi
            exit "$status"
          done <<< "$deps"

      - name: Publish (dry-run, then for real)
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.SECRET_DEPLOY_CRATEIO }}
          CARGO_HTTP_MULTIPLEXING: "false"
        run: |
          set -euo pipefail
          retry() {
            local n=1 max=3
            until "$@"; do
              local code=$?
              if [ "$n" -ge "$max" ]; then
                echo "::error::'$*' failed after $max attempts (exit $code)"; return "$code"
              fi
              echo "::warning::attempt $n of '$*' failed (exit $code); retrying in $((n * 15))s…"
              sleep $((n * 15)); n=$((n + 1))
            done
          }
          retry cargo publish -p "$CRATE" --dry-run
          cargo publish -p "$CRATE"

      - name: Ensure github:pt-immer:rust-devs co-owns the crate
        env:
          CRATE: ${{ steps.parse.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.SECRET_DEPLOY_CRATEIO }}
        run: |
          set -uo pipefail
          if out="$(cargo owner --add github:pt-immer:rust-devs "$CRATE" 2>&1)"; then
            echo "$out"; echo "added github:pt-immer:rust-devs to $CRATE"
          elif echo "$out" | grep -qiE 'already (an )?owner|already invited'; then
            echo "$out"; echo "github:pt-immer:rust-devs already owns $CRATE"
          else
            echo "$out"
            echo "::warning::could not add github:pt-immer:rust-devs to $CRATE (token may lack the crates.io change-owners scope); add it manually or via the Add Crate Owner workflow"
          fi
