[package]
name = "kamu-iso3166"
version = "0.3.0"
description = "Zero-allocation, no_std-compatible ISO 3166-1 and ISO 3166-2 primitives"
documentation = "https://docs.rs/kamu-iso3166"
categories = ["internationalization", "no-std", "parser-implementations"]
keywords = ["country", "embedded", "iso3166", "no-std", "subdivision"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "NOTICE",
  "README.md",
  "VENDORED.md",
  "build.rs",
  "build/**/*.rs",
  "src/**/*.rs",
  "vendor/iso3166-csv/LICENSE.txt",
  "vendor/iso3166-csv/README.md",
  "vendor/iso3166-csv/countries.csv",
  "vendor/iso3166-csv/subdivisions.csv",
]

[features]
alloc = ["serde?/alloc"]
default = ["std"]
serde = ["dep:serde"]
std = ["phf/std", "serde?/std"]

[dependencies]
phf = { workspace = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }

[build-dependencies]
csv = { workspace = true }
phf_codegen = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
