[package]
name = "kamu-money-core"
version = "0.1.0"
description = "Exact monetary arithmetic: fixed-scale i128, compile-time currencies, and explicit residue decisions"
documentation = "https://docs.rs/kamu-money-core"
categories = ["data-structures", "finance"]
keywords = ["currency", "decimal", "fixed-point", "money", "postgres"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
# `include` is explicit because `vendor/list-one.xml` is LOAD-BEARING, not an
# asset: build.rs reads it at compile time, so a package missing it does not
# degrade, it fails to build. An explicit include is a WHITELIST — every licence
# and notice file has to be named here or it silently stops shipping.
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "DESIGN.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "NOTICE",
  "README.md",
  "VENDORED.md",
  "benches/**/*.rs",
  "build.rs",
  "build/**/*.rs",
  "examples/**/*.rs",
  "src/**/*.rs",
  "vendor/list-one.xml",
]
# `benches/` and `examples/` are listed because `[[bench]]` and `[[example]]`
# below NAME those files: an include list that omits them leaves cargo warning
# "ignoring benchmark `kernel` as benches/kernel.rs is not included in the
# published package" on every publish, and ships target declarations that point
# at nothing. The examples are also the clearest documentation this crate has of
# the wire and FX surfaces, so they are worth the few kilobytes.

[features]
# The postgres-types and sqlx adapters live HERE, not in adapter crates:
# `impl ToSql for Money<C>` from an external crate is E0117 (foreign trait,
# foreign type). Same shape `serde` already has, and the same choice chrono and
# uuid make. It is why kamu-money-core has no *-postgres sibling the way
# kamu-snap-response has *-actix and *-axum.
postgres = ["dep:bytes", "dep:postgres-types"]
serde = ["dep:serde"]
sqlx = ["dep:sqlx"]

[dependencies]
bytes = { workspace = true, optional = true }
ethnum = { workspace = true }
postgres-types = { workspace = true, optional = true }
# `derive` and `std` on top of the workspace entry, which is `default-features = false`
# because kamu-iso3166 hand-writes its impls and is no_std. `wire.rs` uses
# `#[derive(Serialize, Deserialize)]` and this crate is std-only, so it asks for both here
# rather than widening the workspace default for everyone.
serde = { workspace = true, optional = true, features = ["derive", "std"] }
sqlx = { workspace = true, optional = true }

[build-dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
roxmltree = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
postgres = { workspace = true }
# proc-macro2 / quote / roxmltree are duplicated from [build-dependencies] on
# purpose: `tests/register_codegen.rs` pulls `build/iso4217.rs` in with `#[path]`
# so the build script's own fixture tests actually run, and a test target
# resolves against dev-dependencies, not build-dependencies.
proc-macro2 = { workspace = true }
proptest = { workspace = true }
quote = { workspace = true }
roxmltree = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true

# `harness = false`: a `fn main()` that prints, not a set of `#[bench]`s. It
# reports best-of-N because that is what DESIGN.md's measurement reports, and a
# fixture producing a different statistic could not corroborate the entry it
# exists to make checkable. It NEVER gates — a threshold invented before there
# is a baseline is worse than no threshold.
[[bench]]
harness = false
name = "kernel"

# Needs the optional feature. Declaring it here means `cargo build --examples`
# and `clippy --all-targets` skip it cleanly under default features instead of
# failing, and build it under --all-features.
[[example]]
name = "wire"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
