[package]
name = "kamu-money-core"
version = "0.1.0"
description = "Exact ISO 4217 monetary arithmetic with fixed-scale i128 and compile-time currencies"
documentation = "https://docs.rs/kamu-money-core"
categories = ["data-structures", "finance"]
keywords = ["currency", "decimal", "fixed-point", "money", "postgres"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
# Explicit package contents keep the build-time ISO register and license notices present.
include = [
  "CHANGELOG.md",
  "Cargo.toml",
  "DESIGN.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "NOTICE",
  "README.md",
  "VENDORED.md",
  "benches/**/*.rs",
  "build.rs",
  "build/**/*.rs",
  "examples/**/*.rs",
  "src/**/*.rs",
  "tests/**/*.rs",
  "vendor/list-one.xml",
]
# Declared targets and the extension lane consume benches, examples, and tests from the
# normalized package.

[features]
# Database adapters live here because an external adapter crate would violate E0117.
postgres = ["dep:bytes", "dep:postgres-types"]
serde = ["dep:serde"]
sqlx = ["dep:sqlx"]

[dependencies]
bytes = { workspace = true, optional = true }
ethnum = { workspace = true }
postgres-types = { workspace = true, optional = true }
# `derive` and `std` on top of the workspace entry, which is `default-features = false`
# because kamu-iso3166 hand-writes its impls and is no_std. `wire.rs` uses
# `#[derive(Serialize, Deserialize)]` and this crate is std-only, so it asks for both here
# rather than widening the workspace default for everyone.
serde = { workspace = true, optional = true, features = ["derive", "std"] }
sqlx = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }

[build-dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
roxmltree = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
postgres = { workspace = true }
# register_codegen imports the build module, so these are test dependencies too.
proc-macro2 = { workspace = true }
proptest = { workspace = true }
quote = { workspace = true }
roxmltree = { workspace = true }
rust_decimal = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true

# Standalone diagnostic benchmark; it reports samples and never gates.
[[bench]]
harness = false
name = "kernel"

[[example]]
name = "fx"

[[example]]
name = "ledger"

# Needs the optional feature. Declaring it here means `cargo build --examples`
# and `clippy --all-targets` skip it cleanly under default features instead of
# failing, and build it under --all-features.
[[example]]
name = "wire"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
