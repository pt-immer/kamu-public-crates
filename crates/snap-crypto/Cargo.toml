[package]
name = "kamu-snap-crypto"
version = "3.0.0"
description = "Validated Bank Indonesia SNAP BI authentication with HMAC-SHA512 and RSA-SHA256"
documentation = "https://docs.rs/kamu-snap-crypto"
categories = ["cryptography", "authentication", "api-bindings"]
keywords = ["snap-bi", "hmac", "rsa", "signature", "indonesia"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["snap-bi", "webhook"]
snap-bi = ["dep:chrono", "dep:http"]
webhook = ["dep:http"]

[dependencies]
base64.workspace = true
hex.workspace = true
hmac.workspace = true
rsa.workspace = true
sha2.workspace = true
thiserror = { workspace = true, features = ["std"] }
chrono = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
chrono.workspace = true
http.workspace = true
proptest.workspace = true
rand_core.workspace = true
serde_json.workspace = true

[[example]]
name = "sign_snap_bi_request"
required-features = ["snap-bi"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
