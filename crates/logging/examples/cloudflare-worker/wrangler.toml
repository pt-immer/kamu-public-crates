compatibility_date = "2026-05-27"
main = "build/index.js"
name = "kamu-logging-cloudflare-worker-example"

[build]
# The default recovery transform currently requires an externref table that this
# worker does not emit. Keep full packaging coverage without that transform.
command = "cargo install worker-build --version 0.8.5 --locked && worker-build --release --no-panic-recovery"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
RUST_LOG = "info,kamu_logging_cloudflare_worker_example=debug"
