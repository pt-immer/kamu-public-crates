[package]
edition = "2024"
name = "kamu-logging-cloudflare-worker-example"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
kamu-logging = { path = "../..", default-features = false, features = ["wasm32"] }
worker = "=0.8.5"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Standalone package: excluded from the root workspace (see root Cargo.toml
# `workspace.exclude`). The empty table makes `cargo` treat this manifest as its
# own workspace root when invoked directly (e.g. `just check-worker-example`),
# instead of erroring that it sits inside — but is excluded from — the parent.
[workspace]
