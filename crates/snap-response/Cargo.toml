[package]
name = "kamu-snap-response"
version = "3.0.0"
description = "Validated response states and error taxonomy for Bank Indonesia SNAP BI integrations"
documentation = "https://docs.rs/kamu-snap-response"
categories = ["api-bindings", "encoding", "web-programming"]
keywords = ["snap-bi", "response", "envelope", "error", "indonesia"]
readme = "README.md"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
crypto = ["dep:kamu-snap-crypto"]

[dependencies]
http.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true, features = ["std"] }
kamu-snap-crypto = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
