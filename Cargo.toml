[workspace]
members = [
  "crates/iso3166",
  "crates/logging",
  "crates/money-core",
  "crates/snap-crypto",
  "crates/snap-crypto-actix",
  "crates/snap-crypto-axum",
  "crates/snap-response",
  "crates/snap-response-actix",
  "crates/snap-response-axum",
]
# The Cloudflare Worker example is a self-contained wasm32 package (its own
# Cargo.toml + workers-rs deps); keep it out of the host workspace build/test.
exclude = ["crates/logging/examples/cloudflare-worker"]
resolver = "3"

[workspace.package]
authors = [
  "PT. IMMER Contributors <https://github.com/pt-immer>",
  "PT. IMMER Engineers <https://github.com/orgs/pt-immer/teams/engineering>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/pt-immer/kamu-public-crates"
rust-version = "1.94"

[workspace.dependencies]
# --- kamu-iso3166 ---
csv = "1.4.0"
phf = { version = "0.14.0", default-features = false }
phf_codegen = "0.14.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
serde = { version = "1.0.229", default-features = false }
serde_json = "1"
thiserror = { version = "2", default-features = false }
# --- kamu-logging ---
actix-web = { version = "4", default-features = false }
console = "0.16"
console_error_panic_hook = "0.1.7"
opentelemetry = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false }
opentelemetry_sdk = { version = "0.32", default-features = false }
# `time` no longer sets the workspace MSRV — `sqlx` 0.9 does, declaring
# rust-version 1.94.0, and kamu-money-core's `sqlx` feature pulls it in. The
# floor here must still stay at or above 0.3.47 — the fix for RUSTSEC-2026-0009
# (RFC 2822 stack-exhaustion DoS) — and keeps the `wasm-bindgen` feature
# kamu-logging's wasm32 path needs.
time = "0.3.54"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
tracing-web = "0.1.3"
# --- kamu-snap-* (Bank Indonesia SNAP BI) ---
# actix-web (declared above) is shared with kamu-logging. `time` is floored
# above 0.3.47 (see above) for RUSTSEC-2026-0009 — actix-web -> cookie pulls it.
axum = { version = "0.8", default-features = false, features = ["json"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
# hmac / sha2 / rand_core are pinned to the digest-0.10 generation: sha2 types
# flow into `rsa` generics (`rsa::pkcs1v15::SigningKey<sha2::Sha256>`), and the
# latest stable rsa (0.9.x) is built on digest 0.10 + rand_core 0.6. Bump the
# whole stack together (hmac 0.13, sha2 0.11, rand_core 0.10) when rsa 0.10
# leaves release-candidate status — don't split digest generations here.
# Re-checked 2026-07-25: rsa max_stable is still 0.9.10 (0.10.0-rc.18 is the
# newest, still a release candidate), so the pin stands.
hmac = { version = "0.12", features = ["reset", "std"] }
http = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["getrandom", "sha2"] }
sha2 = { version = "0.10", features = ["asm", "compress", "oid"] }
# Internal SNAP BI crates — independent versions; caret reqs so a future bump
# of one never force-bumps its dependents (decoupled per-crate releases).
kamu-snap-crypto = { path = "crates/snap-crypto", version = "2" }
kamu-snap-crypto-actix = { path = "crates/snap-crypto-actix", version = "2" }
kamu-snap-crypto-axum = { path = "crates/snap-crypto-axum", version = "2" }
kamu-snap-response = { path = "crates/snap-response", version = "2" }
kamu-snap-response-actix = { path = "crates/snap-response-actix", version = "2" }
kamu-snap-response-axum = { path = "crates/snap-response-axum", version = "3" }
# --- kamu-money-core ---
# `sqlx` is what sets this workspace's MSRV: 0.9 declares rust-version 1.94.0,
# and it arrives through kamu-money-core's `sqlx` feature.
bytes = "1.10"
ethnum = "1.5.3"
# `default-features = false` is load-bearing, not tidiness: postcard's default
# feature set pulls heapless 0.7, which pulls atomic-polyfill, which is
# unmaintained (RUSTSEC-2023-0089) and fails `cargo deny`. `use-std` is all the
# binary wire-format tests need, and without the defaults heapless leaves the
# graph entirely — so this is a real fix rather than an advisory ignore.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
postgres = "0.19.14"
postgres-types = "0.2.14"
roxmltree = "0.21.1"
# Benchmark-only, and a DEV dependency on purpose: `benches/kernel.rs` is the
# fixture that keeps the comparison in money-core's DESIGN.md reproducible.
# Nothing shipped links it.
rust_decimal = "1.38.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres"] }
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
trybuild = "1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
# Note: `clippy::pedantic` is intentionally NOT denied workspace-wide — the
# `tracing-subscriber` builder chains in kamu-logging trip several pedantic
# lints. kamu-iso3166 opts into pedantic via a dedicated CI step instead.

[profile.release]
codegen-units = 1
lto = true
strip = true
