[workspace]
members = ["crates/iso3166", "crates/logging"]
resolver = "3"

[workspace.package]
authors = [
  "PT. IMMER Contributors <https://github.com/pt-immer>",
  "PT. IMMER Engineers <https://github.com/orgs/pt-immer/teams/engineering>",
]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = true
repository = "https://github.com/pt-immer/kamu-public-crates"
rust-version = "1.85"

[workspace.dependencies]
# --- kamu-iso3166 ---
csv = "1.4.0"
phf = { version = "0.13.1", default-features = false }
phf_codegen = "0.13.1"
proc-macro2 = "1.0.106"
proptest = "1.11.0"
quote = "1.0.45"
serde = { version = "1.0.228", default-features = false }
serde_json = "1"
thiserror = { version = "2", default-features = false }
# --- kamu-logging ---
console = "0.16"
console_error_panic_hook = "0.1.7"
tracing = "0.1"
tracing-actix-web = "0.7"
tracing-journald = "0.3"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", default-features = false }
wasm-tracing = { version = "2.1.0", features = ["tracing-log"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
# Note: `clippy::pedantic` is intentionally NOT denied workspace-wide — the
# `tracing-subscriber` builder chains in kamu-logging trip several pedantic
# lints. kamu-iso3166 opts into pedantic via a dedicated CI step instead.

[profile.release]
codegen-units = 1
lto = true
strip = true
